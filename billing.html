<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amavam - Billing & Pricing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/viewport/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><b>Amavam</b></a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link active" href="billing.html">Billing & Plans</a>
                <a class="nav-link" href="#">Services</a>
                <a class="nav-link" href="#">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Pricing Cards -->
    <div class="container my-5">
        <h2 class="text-center mb-4">Our Flexible Billing Plans</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4 text-center">
            
            <!-- Basic Plan -->
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-header py-3"><h4>Basic</h4></div>
                    <div class="card-body">
                        <h1 class="card-title">$19<small class="text-muted fw-light">/mo</small></h1>
                        <ul class="list-unstyled mt-3 mb-4">
                            <li>1 User Included</li>
                            <li>Basic Support</li>
                        </ul>
                        <button type="button" class="w-100 btn btn-outline-primary">Get Started</button>
                    </div>
                </div>
            </div>

            <!-- Pro Plan -->
            <div class="col">
                <div class="card h-100 shadow-sm border-primary">
                    <div class="card-header py-3 bg-primary text-white"><h4>Pro</h4></div>
                    <div class="card-body">
                        <h1 class="card-title">$49<small class="text-muted fw-light">/mo</small></h1>
                        <ul class="list-unstyled mt-3 mb-4">
                            <li>10 Users Included</li>
                            <li>Priority Support</li>
                        </ul>
                        <button type="button" class="w-100 btn btn-primary">Buy Now</button>
                    </div>
                </div>
            </div>

            <!-- Custom Billing Calculator -->
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-header py-3"><h4>Custom Billing</h4></div>
                    <div class="card-body">
                        <p>Calculate cost based on your need:</p>
                        <input type="number" id="users" class="form-control mb-2" placeholder="Enter number of users">
                        <button onclick="calculateBilling()" class="w-100 btn btn-dark">Calculate</button>
                        <h4 class="mt-3 text-success" id="totalPrice"></h4>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Simple JavaScript for Billing Calculation -->
    <script>
        function calculateBilling() {
            let users = document.getElementById('users').value;
            let pricePerUser = 5; // $5 per user
            if(users > 0) {
                let total = users * pricePerUser;
                document.getElementById('totalPrice').innerText = "Total: $" + total + "/mo";
            } else {
                document.getElementById('totalPrice').innerText = "Please enter valid users";
            }
        }
    </script>
</body>
</html>
